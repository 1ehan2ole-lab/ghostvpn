name: Feature request
description: Предложить функцию
labels: [enhancement]
body:
  - type: textarea
    id: feature
    attributes:
      label: Какая функция нужна
      description: Опишите сценарий использования, а не только реализацию
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы
    validations:
      required: false
