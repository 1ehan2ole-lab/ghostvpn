name: Deploy site to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Сборка статического сайта
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Подготовка сайта
        run: |
          mkdir -p _site
          cp -r web/* _site/
          # Адрес панели берётся из переменной репозитория PANEL_URL
          # (Settings -> Secrets and variables -> Actions -> Variables).
          PANEL_URL="${{ vars.PANEL_URL }}"
          if [ -z "$PANEL_URL" ]; then PANEL_URL="http://localhost:8080"; fi
          cat > _site/config.js <<EOF
          window.GHOSTVPN_API_BASE = '${PANEL_URL}';
          window.GHOSTVPN_PANEL_URL = '${PANEL_URL}';
          EOF
          # Версия config.js в URL, чтобы браузер не держал старый кэш.
          BUILD_ID=$(date +%s)
          for html in _site/*.html; do
            sed -i "s|src=\"config.js\"|src=\"config.js?v=${BUILD_ID}\"|" "$html"
          done
          # Серверные страницы (кабинет, вход, регистрация) заменяем
          # на заглушку со ссылкой на панель.
          for page in login register dashboard admin; do
            cat > "_site/$page.html" <<EOF2
          <!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>GhostVPN</title>
          <link rel="stylesheet" href="assets/css/style.css"></head>
          <body><div class="auth-wrap"><div class="container auth-card">
          <div class="card center">
          <div class="ghost-logo" style="margin:0 auto 18px">👻</div>
          <h1 style="font-size:1.4rem">Панель GhostVPN</h1>
          <p class="small">Кабинет, вход и регистрация доступны в панели.
          Нажмите кнопку, чтобы перейти туда.</p>
          <a class="btn" href="${PANEL_URL}/register">Зарегистрироваться</a>
          <a class="btn btn-ghost mt-2" href="${PANEL_URL}/login">Войти</a>
          </div></div></div></body></html>
          EOF2
          done

      - name: Настройка Pages
        uses: actions/configure-pages@v5

      - name: Сборка артефакта
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
