name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Установка ядра Xray
        run: npm run xray:install

      - name: Проверка синтаксиса
        run: node --check server/index.js

      - name: Тесты
        run: npm test

  build:
    name: Сборка Docker-образа
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Сборка образа
        run: docker build -t ghostvpn:ci .

      - name: Проверка конфигурации Xray
        run: |
          docker run --rm ghostvpn:ci node scripts/xray-control.js config
          docker run --rm ghostvpn:ci node -e "console.log('ok')"
