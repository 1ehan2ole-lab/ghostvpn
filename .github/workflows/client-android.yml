name: Client Android

on:
  push:
    branches: [main, master]
    paths: ['clients/GhostVPN.Android/**', '.github/workflows/client-android.yml']
  workflow_dispatch:

jobs:
  build:
    name: Сборка APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Ядро sing-box для Android
        run: |
          version=1.14.3
          url="https://github.com/SagerNet/sing-box/releases/download/v${version}/sing-box-${version}-android-arm64.tar.gz"
          curl -fsSL "$url" -o sing-box.tar.gz
          mkdir -p clients/GhostVPN.Android/app/src/main/jniLibs/arm64-v8a
          tar -xzf sing-box.tar.gz -C /tmp
          cp /tmp/*/sing-box clients/GhostVPN.Android/app/src/main/jniLibs/arm64-v8a/libexec.so
          chmod +x clients/GhostVPN.Android/app/src/main/jniLibs/arm64-v8a/libexec.so

      - name: tun2socks (hev-socks5-tunnel)
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build
          git clone --depth 1 https://github.com/heiher/hev-socks5-tunnel.git
          cd hev-socks5-tunnel
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_NDK=$ANDROID_NDK_HOME -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 -DHEV_SOCKS5_TUNNEL_ENABLE_STATIC=OFF
          cmake --build build --target hev-socks5-tunnel
          cp build/hev-socks5-tunnel \
            ../clients/GhostVPN.Android/app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so

      - name: Сборка APK
        run: |
          cd clients/GhostVPN.Android
          chmod +x gradlew || true
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ghostvpn-android
          path: clients/GhostVPN.Android/app/build/outputs/apk/release/*.apk
