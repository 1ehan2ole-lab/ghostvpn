name: Client Android

on:
  push:
    branches: [main, master]
    paths: ['clients/GhostVPN.Android/**', '.github/workflows/client-android.yml']
  workflow_dispatch:

jobs:
  build:
    name: Сборка APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Компоненты Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Ядро sing-box для Android
        run: |
          version=1.14.3
          url="https://github.com/SagerNet/sing-box/releases/download/v${version}/sing-box-${version}-android-arm64.tar.gz"
          curl -fsSL "$url" -o sing-box.tar.gz
          mkdir -p clients/GhostVPN.Android/app/src/main/jniLibs/arm64-v8a
          tar -xzf sing-box.tar.gz -C /tmp
          cp /tmp/*/sing-box clients/GhostVPN.Android/app/src/main/jniLibs/arm64-v8a/libexec.so
          chmod +x clients/GhostVPN.Android/app/src/main/jniLibs/arm64-v8a/libexec.so

      - name: tun2socks (hev-socks5-tunnel, готовые сборки)
        run: |
          curl -fsSL -o clients/GhostVPN.Android/app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so \
            https://github.com/heiher/hev-socks5-tunnel/releases/download/2.19.1/hev-socks5-tunnel-android-arm64-v8a
          chmod +x clients/GhostVPN.Android/app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so

      - name: Сборка APK
        run: |
          cd clients/GhostVPN.Android
          gradle wrapper --gradle-version 8.11.1 --no-daemon
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ghostvpn-android
          path: clients/GhostVPN.Android/app/build/outputs/apk/release/*.apk
