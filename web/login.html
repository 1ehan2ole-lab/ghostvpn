<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — GhostVPN</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👻</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="container auth-card">
    <a class="brand" href="/" style="justify-content:center;margin-bottom:22px">
      <span class="ghost-logo">👻</span>
      <span class="accent" data-site-name>GhostVPN</span>
    </a>

    <div class="card">
      <h1 style="font-size:1.6rem">Вход в аккаунт</h1>
      <p class="small">Введите e-mail или имя пользователя.</p>

      <div class="alert alert-error" id="alert"></div>

      <div class="alert alert-info hidden" id="alreadyIn">
        <span id="alreadyInText"></span>
        <a href="/dashboard" id="goCabinet" style="color:var(--brand-2)">В кабинет →</a>
        <div style="margin-top:6px">
          <button type="button" class="btn btn-ghost btn-sm" id="switchAccount">Войти как другой пользователь</button>
        </div>
      </div>

      <form id="loginForm" autocomplete="on">
        <div class="field">
          <label for="login">Логин</label>
          <input class="input" id="login" name="login" placeholder="you@example.com" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input class="input" id="password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button class="btn btn-block" id="submitBtn" type="submit">Войти</button>
      </form>

      <p class="small mt-3 mb-0" style="text-align:center">
        Нет аккаунта? <a href="/register" style="color:var(--brand-2)">Зарегистрироваться</a>
      </p>
    </div>

    <p class="center small muted mt-3"><a href="/">← На главную</a></p>
  </div>
</div>

<script src="config.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function () {
  'use strict';
  const form = document.getElementById('loginForm');
  const alertBox = document.getElementById('alert');
  const btn = document.getElementById('submitBtn');

  // Если сессия уже есть - предлагаем кабинет, но не мешаем войти другим аккаунтом.
  let sessionUser = null;
  Ghost.loadSession().then(function (user) {
    if (!user) return;
    sessionUser = user;
    const box = document.getElementById('alreadyIn');
    box.classList.remove('hidden');
    document.getElementById('alreadyInText').textContent =
      'Вы вошли как ' + user.email + '.';
    document.getElementById('goCabinet').href =
      user.role === 'admin' ? '/admin' : '/dashboard';
  });

  // Принимаем только внутренние пути (защита от open redirect).
  function safeNext() {
    const value = new URLSearchParams(location.search).get('next');
    if (!value) return null;
    const path = decodeURIComponent(value);
    if (!path.startsWith('/') || path.startsWith('//')) return null;
    return path;
  }

  function fail(message) {
    alertBox.textContent = message;
    alertBox.classList.add('show');
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    alertBox.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Входим...';
    try {
      const res = await Ghost.api('/api/auth/login', {
        method: 'POST',
        body: { login: login.value, password: password.value },
      });
      const next = safeNext();
      location.replace(next || (res.user && res.user.role === 'admin' ? '/admin' : '/dashboard'));
    } catch (err) {
      fail(err.message || 'Не удалось войти');
      btn.disabled = false;
      btn.textContent = 'Войти';
    }
  });

  document.getElementById('switchAccount').addEventListener('click', async function () {
    await Ghost.api('/api/auth/logout', { method: 'POST' });
    document.getElementById('alreadyIn').classList.add('hidden');
    document.getElementById('login').focus();
  });
})();
</script>
</body>
</html>
